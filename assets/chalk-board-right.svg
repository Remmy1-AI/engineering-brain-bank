<svg xmlns="http://www.w3.org/2000/svg" width="480" height="900" viewBox="0 0 480 900" fill="none">
  <!-- Tall right chalk board: architectural CAD wireframe (mirrored composition) -->
  <g stroke="#e8e8e8" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- perspective box (right-leaning) -->
    <path d="M200 90 L320 50 L440 100 L320 140 Z"/>
    <path d="M200 90 L200 190 L320 230 L320 140"/>
    <path d="M440 100 L440 200 L320 230"/>
    <path d="M200 140 L320 180 L440 150" stroke-opacity="0.35"/>
    <!-- second volume -->
    <path d="M210 260 L310 220 L410 270 L310 310 Z"/>
    <path d="M210 260 L210 340 L310 380 L310 310"/>
    <path d="M410 270 L410 350 L310 380"/>
    <!-- portal / arch frame -->
    <path d="M280 460 V600 H430 V460"/>
    <path d="M280 460 L355 410 L430 460"/>
    <path d="M355 410 V500"/>
    <path d="M280 530 H430 M280 560 H430"/>
    <!-- channel / C-section -->
    <path d="M120 440 V540 H160 V440"/>
    <path d="M120 440 H100 M160 440 H180 M120 540 H100 M160 540 H180"/>
    <path d="M100 440 V540 M180 440 V540" stroke-opacity="0.35"/>
    <!-- warren truss -->
    <path d="M260 700 L340 650 L420 700 L340 750 Z"/>
    <path d="M340 650 V750 M260 700 H420"/>
    <path d="M300 675 L340 700 L380 675 M300 725 L340 700 L380 725" stroke-opacity="0.4"/>
  </g>
  <g stroke="#d0d0d0" stroke-opacity="0.4" stroke-width="1" stroke-linecap="round">
    <!-- circles / targets -->
    <circle cx="100" cy="150" r="40"/>
    <circle cx="100" cy="150" r="24"/>
    <circle cx="100" cy="150" r="7"/>
    <circle cx="100" cy="150" r="2" fill="#d0d0d0" fill-opacity="0.5" stroke="none"/>
    <path d="M100 110 V190 M60 150 H140"/>
    <circle cx="60" cy="250" r="16"/>
    <circle cx="160" cy="290" r="12"/>
    <path d="M100 150 L60 250 L160 290 L100 150"/>
    <!-- dimension ticks -->
    <path d="M260 820 H440"/>
    <path d="M260 815 V825 M440 815 V825"/>
    <path d="M300 820 V810 M340 820 V810 M380 820 V810 M420 820 V810"/>
    <path d="M80 760 V860"/>
    <path d="M75 760 H85 M75 860 H85"/>
    <path d="M80 785 H88 M80 810 H88 M80 835 H88"/>
    <!-- angle arcs -->
    <path d="M360 60 A36 36 0 0 0 400 90" stroke-dasharray="3 4"/>
    <path d="M360 60 L340 40 M400 90 L430 75"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.8">
    <!-- fine grid patches -->
    <path d="M320 30 H460 M320 45 H460 M320 60 H460 M320 75 H460 M320 90 H460"/>
    <path d="M335 20 V105 M350 20 V105 M365 20 V105 M380 20 V105 M395 20 V105 M410 20 V105 M425 20 V105 M440 20 V105"/>
    <path d="M40 500 H180 M40 515 H180 M40 530 H180 M40 545 H180 M40 560 H180"/>
    <path d="M55 490 V575 M70 490 V575 M85 490 V575 M100 490 V575 M115 490 V575 M130 490 V575 M145 490 V575 M160 490 V575"/>
    <!-- dashed construction -->
    <path d="M280 390 H460" stroke-dasharray="5 7"/>
    <path d="M200 360 V470" stroke-dasharray="4 6"/>
    <path d="M450 240 C400 260 360 290 320 340" stroke-dasharray="3 5"/>
  </g>
  <g stroke="#c8c8c8" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round">
    <!-- column elevation -->
    <rect x="130" y="620" width="28" height="160" rx="1"/>
    <path d="M120 620 H168 M120 780 H168"/>
    <path d="M130 660 H158 M130 700 H158 M130 740 H158" stroke-opacity="0.3"/>
    <!-- staircase -->
    <path d="M50 650 H100 V670 H70 V690 H100 V710 H70 V730 H100 V750 H50"/>
    <!-- small floor plan inset -->
    <rect x="370" y="200" width="70" height="50"/>
    <path d="M370 225 H440 M405 200 V250"/>
    <path d="M390 215 H405 V235 H390 Z" stroke-opacity="0.5"/>
    <!-- gear / mechanism sketch -->
    <circle cx="80" cy="400" r="28"/>
    <circle cx="80" cy="400" r="10"/>
    <path d="M80 372 L86 385 L100 380 L94 394 L108 400 L94 406 L100 420 L86 415 L80 428 L74 415 L60 420 L66 406 L52 400 L66 394 L60 380 L74 385 Z" stroke-opacity="0.35"/>
  </g>
  <g stroke="#b8b8b8" stroke-opacity="0.35" stroke-width="0.9">
    <!-- vanishing rays from left edge -->
    <path d="M0 450 L280 180"/>
    <path d="M0 450 L300 480"/>
    <path d="M0 450 L260 720"/>
    <!-- bolt flange -->
    <circle cx="200" cy="400" r="30"/>
    <circle cx="200" cy="400" r="5"/>
    <circle cx="200" cy="380" r="3"/>
    <circle cx="200" cy="420" r="3"/>
    <circle cx="180" cy="400" r="3"/>
    <circle cx="220" cy="400" r="3"/>
  </g>
</svg>
